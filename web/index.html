<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCLEPIUS BCC detector</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2430; --muted: #667085;
    --border: #d5dae1; --accent: #2563eb; --warn: #d97706; --alert: #dc2626; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --panel: #1b212a; --text: #e6e9ee; --muted: #98a2b3;
      --border: #333c49; --accent: #6ea0ff; --warn: #f5a524; --alert: #ff6b6b; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.5rem; }
  .sub { margin: 4px 0 24px; color: var(--muted); }
  #drop {
    display: block; padding: 36px 16px; text-align: center; cursor: pointer;
    background: var(--panel); border: 2px dashed var(--border); border-radius: 12px;
  }
  #drop.over { border-color: var(--accent); }
  #drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  #drop strong { color: var(--accent); }
  #drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  #status { min-height: 1.5em; margin: 16px 0 8px; color: var(--muted); }
  #status.error { color: var(--alert); }
  canvas { display: none; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--border); }
  #results { list-style: none; margin: 16px 0 0; padding: 0; }
  #results li {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
    padding: 12px 16px; margin-bottom: 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  }
  .bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--warn); }
  .pct { font-weight: 600; font-variant-numeric: tabular-nums; }
  li.alert .bar span { background: var(--alert); }
  li.alert .pct { color: var(--alert); }
  .tag { font-size: 0.75rem; font-weight: 600; color: var(--alert); margin-left: 6px; }
  .none { color: var(--ok); }
  footer { margin-top: 32px; font-size: 0.875rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>ASCLEPIUS</h1>
  <p class="sub">Basal cell carcinoma detector. Images are analyzed in memory and never saved.</p>

  <label id="drop">
    <input type="file" id="file" accept="image/*">
    Drag an image here, or <strong>choose a file</strong>
  </label>

  <p id="status" role="status"></p>
  <canvas id="canvas"></canvas>
  <ul id="results"></ul>

  <footer>Research prototype, not a diagnosis. The model was trained only on BCC images, so it can also flag other skin lesions. See a doctor about any lesion that concerns you.</footer>
</main>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const statusEl = document.getElementById('status');
const canvas = document.getElementById('canvas');
const results = document.getElementById('results');
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle('error', isError);
  statusEl.classList.remove('none');
}

function draw(image, detections, alert) {
  canvas.width = image.naturalWidth;
  canvas.height = image.naturalHeight;
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  ctx.drawImage(image, 0, 0);
  const unit = Math.max(canvas.width, canvas.height) / 300;
  ctx.lineWidth = Math.max(2, unit);
  ctx.font = `600 ${Math.max(14, unit * 5)}px system-ui, sans-serif`;
  ctx.textBaseline = 'top';
  detections.forEach((d, i) => {
    const [x1, y1, x2, y2] = d.box;
    const color = d.confidence >= alert ? css('--alert') : css('--warn');
    ctx.strokeStyle = color;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    const label = `${i + 1}  ${(d.confidence * 100).toFixed(1)}%`;
    const pad = unit * 1.5;
    const height = parseInt(ctx.font.match(/(\d+)px/)[1]) + pad * 2;
    const width = ctx.measureText(label).width + pad * 2;
    const top = Math.max(0, y1 - height);
    ctx.fillStyle = color;
    ctx.fillRect(x1, top, width, height);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x1 + pad, top + pad);
  });
}

function list(detections, alert) {
  results.replaceChildren();
  detections.forEach((d, i) => {
    const pct = (d.confidence * 100).toFixed(1);
    const isAlert = d.confidence >= alert;
    const li = document.createElement('li');
    if (isAlert) li.className = 'alert';
    li.innerHTML = `<span>Detection ${i + 1}${isAlert ? '<span class="tag">ALERT</span>' : ''}</span>
      <div class="bar"><span style="width:${pct}%"></span></div>
      <span class="pct">${pct}%</span>`;
    results.append(li);
  });
}

async function run(file) {
  if (!file || !file.type.startsWith('image/')) return setStatus('Please choose an image file.', true);
  setStatus('Analyzing…');
  results.replaceChildren();

  const image = new Image();
  image.src = URL.createObjectURL(file);
  try {
    await image.decode();
    const response = await fetch('/predict', { method: 'POST', body: file });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error);
    draw(image, data.detections, data.alert);
    list(data.detections, data.alert);
    const n = data.detections.length;
    if (n === 0) {
      setStatus('No BCC detected in this image.');
      statusEl.classList.add('none');
    } else {
      const alerts = data.detections.filter(d => d.confidence >= data.alert).length;
      setStatus(`${n} detection${n > 1 ? 's' : ''}` +
        (alerts ? `, ${alerts} at or above the ${Math.round(data.alert * 100)}% alert level.` : `, none at the ${Math.round(data.alert * 100)}% alert level.`));
    }
  } catch (err) {
    canvas.style.display = 'none';
    setStatus(err.message || 'Could not analyze that image. Is the server still running?', true);
  } finally {
    URL.revokeObjectURL(image.src);
  }
}

fileInput.addEventListener('change', () => run(fileInput.files[0]));
['dragenter', 'dragover'].forEach(type => drop.addEventListener(type, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(type => drop.addEventListener(type, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => run(e.dataTransfer.files[0]));
// Dropping anywhere else on the page should not navigate away to the image.
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());
</script>
</body>
</html>
